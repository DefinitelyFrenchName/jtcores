# jtcps2w — the CPS-2 WIDE (Vampire Saved) file list.
#
# THIS FILE IS NO LONGER cores/cps2/cfg/game.yaml VERBATIM, and the delta IS
# the core's trust surface. Since slice D1 (14z-107) cps2w carries RTL: a file
# is copied into cores/cps2w/hdl ONLY when it must differ, and it is then
# pulled from `cps2w` here and REMOVED from the reference core's list, because
# jtframe deduplicates by full path and would otherwise compile both copies of
# the same module. Everything else still resolves to cores/cps2, cores/cps1
# and cores/cps15, which stay BYTE-UNTOUCHED.
#
# THE OVERRIDES, and why each one has to differ (docs/project/mister_map.md):
#   jtcps2_game.v    — the game top: 24-bit qsnd_addr, the profile gate
#                      instance, wide_en routed to the sound block and to the
#                      SDRAM block, rom0_bank widened to 3 bits (D1 + D2).
#   jtcps15_sound.v  — the QSound block: 24-bit qsnd_addr and the sample-bank
#                      latch replaced by the gated jtcps2w_qsnd_bank (D1).
#   jtcps1_sdram.v   — SLICE D2: the bank-0 re-pack, the QSound read split on
#                      pcm_addr[23], the group-C obj read select, and the two
#                      new slot counts (7 in bank 0, 2 in bank 1).
#   jtcps1_prom_we.v — SLICE D2: the DOWNLOAD-side group-C redirect and the
#                      QSound bank split, both gated by wide_en.
#   jtcps2_obj_scan.v— SLICE D3: THE OBJ PROMOTE. The CPS-2 Turbo rule — after
#                      the sprite-list terminator test, promote y bit 12 and
#                      read a 3-bit GFX bank — gated by wide_en.
#   jtcps2_obj.v     — SLICE D3: the 3-bit bank wire and output port.
#   jtcps1_obj_draw.v— SLICE D3: the 3-bit bank in and out. Width only.
#   jtcps1_video.v   — SLICE D3: the 3-bit rom0_bank out, and wide_en in on
#                      its way to the object scanner.
#   jtcps2_main.v    — SLICE D4: the 6 MB program window — a READ-ONLY decode
#                      into CPU:$400000-$5FFFFF, the widened rom_addr and the
#                      wait-state boundary, all gated by wide_en.
# THE NEW FILES:
#   jtcps2w_profile.v    — decodes the CPS-2 WIDE bit out of the ROM header.
#   jtcps2w_qsnd_bank.v  — the gated sample-bank latch (the D1 trust surface).
#   jtcps2w_obj_bank.v   — the gated CPS-2 Turbo obj promote (the D3 trust
#                          surface), lifted out of jtcps2_obj_scan so it can be
#                          swept over all 65,536 y-words in both profile states.
#
# THE `common.yaml` BLOCK below is cores/cps1/cfg/common.yaml INLINED minus
# jtcps1_sdram.v and jtcps1_prom_we.v, for exactly the reason the `qsound.yaml`
# block was inlined at D1: that yaml pulls the shared files, so cps2w cannot
# include it and override them at the same time. Keep the two in step by hand
# if the pin ever moves; tests/test_jtcores_twin.sh freezes this list.
#
# jtframe_ram1_7slots.v is an ADDITION to modules/jtframe/hdl/sdram (a
# mechanical member of the ram1_Nslots family, which upstream stops at 5). It
# is pulled HERE and not from jtframe's own jtframe_sdram64.yaml on purpose:
# that yaml is SHARED, and adding a line to it would put the new module on
# every jtcores core's compile list, including the reference cps2.
game:
  - from: cps2w
    get:
      - jtcps2_game.v          # OVERRIDE of cores/cps2/hdl
      - jtcps15_sound.v        # OVERRIDE of cores/cps15/hdl
      - jtcps1_sdram.v         # OVERRIDE of cores/cps1/hdl  (D2)
      - jtcps1_prom_we.v       # OVERRIDE of cores/cps1/hdl  (D2)
      - jtcps2_obj_scan.v      # OVERRIDE of cores/cps2/hdl  (D3)
      - jtcps2_obj.v           # OVERRIDE of cores/cps2/hdl  (D3)
      - jtcps1_obj_draw.v      # OVERRIDE of cores/cps1/hdl  (D3)
      - jtcps1_video.v         # OVERRIDE of cores/cps1/hdl  (D3)
      - jtcps2_main.v          # OVERRIDE of cores/cps2/hdl  (D4)
      - jtcps2w_profile.v      # new
      - jtcps2w_qsnd_bank.v    # new
      - jtcps2w_obj_bank.v     # new  (D3)
  - from: cps2
    get:
      - jtcps2_objram.v
      - jtcps2_obj_frame.v
      - jtcps2_colmix.v
      - jtcps2_raster.v
      - jtcps2_dtack.v
        # Encryption
      - jtcps2_keyload.v
      - jtcps2_decrypt.v
      - jtcps2_fn1.v
      - jtcps2_fn2.v
      - jtcps2_fn_sbox.v
      - jtcps2_sbox.v
      - jtcps2_dec_ctrl.v
  # --- from cores/cps1/cfg/common.yaml, minus the two overridden files ---
  - from: cps1
    get:
      - jtcps1_scroll.v
      - jtcps1_timing.v
      - jtcps1_tilemap.v
      - jtcps1_colmix.v
      - jtcps1_pal.v
      - jtcps1_mmr.v
      - jtcps1_obj_line_table.v
      - jtcps1_obj_tile_match.v
      - jtcps1_obj_line.v
      - jtcps1_stars.v
      - jtcps1_gfx_mappers.v
      - jtcps1_cpucen.v
      - jtcps1_dma.v
      - jtcps1_watch.v
jtframe:
  - from: ram
    get:
      - jtframe_dual_ram16.v
      - jtframe_dual_ram.v
      - jtframe_ram.v
  - from: cpu
    get:
      - jtframe_z80.yaml
      - jtframe_virq.v
      - jtframe_m68k.yaml
      - jtframe_kabuki.v
  - from: sdram
    get:
      - jtframe_romrq.v
      - jtframe_ram_rq.v
      - jtframe_ram1_7slots.v    # ADDED to jtframe by this project (D2)
  - from: video
    get:
      - jtframe_credits.v
  - from: keyboard
    get:
      - jt4701.v
      - jtframe_dial.v
  - from: clocking
    get:
      - jtframe_cen48.v
      - jtframe_cen96.v
      - jtframe_frac_cen.v
  - from: sound
    get:
      - jtframe_mixer.v
      - jtframe_fir.v
      - jtframe_uprate2_fir.v
modules:
  jt:
    - name: jtdsp16
  other:
    - from: jteeprom/hdl
      get:
      - jt9346_16b8b.v
      - jt9346.v
